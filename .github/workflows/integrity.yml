name: Site integrity
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: HTML/CSS integrity + contrast checks
        run: python3 scripts/integrity_check.py
      - name: Canonical and social metadata checks
        run: python3 scripts/metadata_check.py
      - name: JS syntax
        run: |
          find scripts -name '*.js' -print0 | xargs -0 -n1 node --check
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i -D @playwright/test http-server && npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload Phase 4 visual certification captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-visual-certification
          path: phase4-visual-artifacts/
          if-no-files-found: ignore
          retention-days: 7
